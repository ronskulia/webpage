    <title>Uliana Ronska — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --paper: #FAFAF6;
        --ink: #141821;
        --ink-soft: #4A5160;
        --line: #E3E2DA;
        --blue: #2B4C9B;
        --duck: #FFD23F;
        --duck-soft: #FFE58A;
        --maxw: 720px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

      /* header */
      header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 36px 0 0; font-size: 14px;
      }
      header .name {
        font-weight: 600; letter-spacing: -0.02em; font-size: 32px; line-height: 1;
        color: var(--ink); text-decoration: none;
      }
      header nav a {
        color: var(--ink-soft); text-decoration: none; margin-left: 18px;
        border-bottom: 1px solid transparent;
      }
      header nav a:hover, header nav a:focus-visible { color: var(--ink); border-bottom-color: var(--duck); }
      header nav a.active { color: var(--ink); border-bottom-color: var(--duck); }
      header nav a.ua { color: var(--blue); }
      a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

      /* content */
      .page { padding: 72px 0 20px; }
      .page h1 {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 27px;
        font-weight: 500; letter-spacing: -0.01em; line-height: 1.2;
        margin-bottom: 32px;
      }
      .contact-item { margin-bottom: 26px; }
      .contact-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--ink-soft); margin-bottom: 5px;
      }
      .contact-item a {
        color: var(--blue); font-size: 19px; text-decoration: none;
        border-bottom: 1px solid rgba(43,76,155,.3);
      }
      .contact-item a:hover { border-bottom-color: var(--blue); }

      /* footer */
      footer {
        margin-top: 90px; padding: 30px 0 44px;
        border-top: 1px solid var(--line);
        display: flex; justify-content: space-between; align-items: center;
        gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft);
      }
      footer a { color: var(--ink-soft); text-decoration: none; margin-right: 18px; border-bottom: 1px solid transparent; }
      footer a:hover { color: var(--ink); border-bottom-color: var(--duck); }
      footer a.ua { color: var(--blue); }

      @media (max-width: 560px) { .ua-full { display: none; } }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
</head>
<body>
  <div class="wrap">

    <header>
      <a href="/" class="name">Uliana Ronska</a>
      <nav>
        <a href="/Uliana Ronska CV.pdf">cv</a>
        <a href="/random.html">random</a>
        <a href="/contact.html" class="active">contact</a>
        <a href="/donate.html" class="ua">donate<span class="ua-full"> to Ukraine</span> 🇺🇦</a>
      </nav>
    </header>

    <section class="page">
      <h1>Get in touch</h1>

      <div class="contact-item">
        <div class="contact-label">Email</div>
        <a href="mailto:u.ronskaya@gmail.com">u.ronskaya at gmail.com</a>
      </div>

      <div class="contact-item">
        <div class="contact-label">LinkedIn</div>
        <a href="https://www.linkedin.com/in/uliana-ronska" target="_blank">linkedin.com/in/uliana-ronska</a>
      </div>
    </section>

    <footer>
      <div>
        <a href="/">home</a>
        <a href="/Uliana Ronska CV.pdf">cv</a>
        <a href="/random.html">random</a>
        <a href="/donate.html" class="ua">donate to Ukraine 🇺🇦</a>
      </div>
    </footer>

  </div>
</body>
</html>
