<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uliana - Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f7;
            --card: #ffffff;
            --text: #2d2a26;
            --text-soft: #5c574f;
            --accent: #c4704b;
            --accent-light: #f5ebe6;
            --border: #e8e6e3;
            --sage: #7a8c6e;
            --sage-light: #eef2eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            line-height: 1.7;
            font-size: 17px;
        }

        ::selection {
            background: var(--accent-light);
            color: var(--text);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* Header */
        .header {
            margin-bottom: 3rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .header h1 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 2.2rem;
            font-weight: 500;
            color: var(--text);
        }

        .nav {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-soft);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--accent);
        }

        .nav-link.active {
            color: var(--accent);
        }

        .nav-link .mobile-only {
            display: none;
        }

        .header .subtitle {
            color: var(--text-soft);
            font-size: 1rem;
        }

        /* Content */
        .content {
            margin-bottom: 3rem;
        }

        .content h2 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 1.5rem;
        }

        .contact-item {
            margin-bottom: 1.25rem;
        }

        .contact-label {
            font-size: 0.85rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .contact-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 1.1rem;
            transition: opacity 0.2s ease;
        }

        .contact-link:hover {
            opacity: 0.7;
        }

        /* Footer */
        .footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer a {
            color: var(--text-soft);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 2.5rem 1.25rem;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header-top {
                flex-direction: column;
                gap: 0.75rem;
            }

            .nav {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .nav-link .desktop-only {
                display: none;
            }

            .nav-link .mobile-only {
                display: inline;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1>Uliana Ronska</h1>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Projects</a>
                    <a href="experience.html" class="nav-link">Experience</a>
                    <a href="cv_Uliana_Ronska.pdf" class="nav-link" target="_blank">CV</a>
                    <a href="contact.html" class="nav-link active">Contact</a>
                    <a href="donate.html" class="nav-link"><span class="desktop-only">Donate to Ukraine</span><span class="mobile-only">Donate</span> 🇺🇦</a>
                </nav>
            </div>
        </header>

        <section class="content">
            <h2>Get in touch</h2>
            
            <div class="contact-item">
                <p class="contact-label">Email</p>
                <a href="mailto:u.ronskaya@gmail.com" class="contact-link">u.ronskaya@gmail.com</a>
            </div>

            <div class="contact-item">
                <p class="contact-label">LinkedIn</p>
                <a href="https://www.linkedin.com/in/uliana-ronska" class="contact-link" target="_blank">linkedin.com/in/uliana-ronska</a>
            </div>
        </section>

        <footer class="footer">
            <nav class="footer-links">
                <a href="index.html">Projects</a>
                <a href="experience.html">Experience</a>
                <a href="cv_Uliana_Ronska.pdf" target="_blank">CV</a>
                <a href="donate.html">Donate to Ukraine</a>
            </nav>
        </footer>
    </div>
</body>
</html>
